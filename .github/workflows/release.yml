name: Release

on:
  push:
    tags:
      - "v*"
      - "profiler/**/v*"
      - "cmd/**/v*"
      - "storage/**/v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: ./scripts/modules.sh verify
      - run: node --check ui/app.js
      - run: ./scripts/modules.sh vet
      - run: ./scripts/modules.sh test -race -shuffle=on -count=1
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: ./scripts/modules.sh vuln

  release:
    # Nested modules are published by their Git tag and proxy.golang.org.
    # Only a root vX.Y.Z tag gets a GitHub Release page.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish root GitHub release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
