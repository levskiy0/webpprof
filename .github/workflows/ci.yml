name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: node --check ui/app.js
      - run: go vet ./...
      - run: go test -race -shuffle=on ./... -count=1 -coverprofile=coverage.out
      - run: go test . -run '^$' -bench BenchmarkEntryStorePutAndList -benchtime=100x
