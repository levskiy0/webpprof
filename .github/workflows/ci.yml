name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: ./scripts/modules.sh verify
      - run: ./scripts/modules.sh tidy
      - run: git diff --exit-code -- '**/go.mod' '**/go.sum' go.work go.work.sum
      - run: ./scripts/check-core-dependencies.sh
      - run: node --check ui/app.js
      - run: ./scripts/modules.sh vet
      - run: ./scripts/modules.sh test -race -shuffle=on -count=1
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: ./scripts/modules.sh vuln
      - run: go test . -run '^$' -bench BenchmarkProfilerOverhead -benchtime=100x
