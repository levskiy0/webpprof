name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: ./scripts/modules.sh verify
      - run: ./scripts/modules.sh tidy
      - run: git diff --exit-code -- '**/go.mod' '**/go.sum' go.work go.work.sum
      - run: node --check ui/app.js
      - run: ./scripts/modules.sh vet
      - run: ./scripts/modules.sh test -race -shuffle=on -count=1
      - run: go test . -run '^$' -bench BenchmarkEntryStorePutAndList -benchtime=100x
