<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>webpprof</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="details.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="logo.svg" alt="">
        <div><h1>webpprof</h1><p>Application Profiler</p></div>
      </div>
      <div class="status-group">
        <span id="socket-status" class="status offline" aria-live="polite">Offline</span>
        <span id="event-count" class="metric" aria-live="polite">0 events</span>
        <button id="pause" class="icon-button" type="button" title="Pause recording" aria-label="Pause recording"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M16 6v12"/></svg><span class="sr-only">Pause recording</span></button>
        <button id="clear" class="icon-button danger" type="button" title="Clear entries" aria-label="Clear entries"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg><span class="sr-only">Clear entries</span></button>
      </div>
    </header>
    <section id="login" class="login hidden">
      <form id="login-form" class="login-card">
        <div><p class="eyebrow">Protected workspace</p><h2>Open webpprof</h2><p class="login-copy">Enter the access token configured for this process.</p></div>
        <label for="token">Access token</label>
        <input id="token" type="password" autocomplete="current-password" placeholder="WEBPPROF_TOKEN" required>
        <p id="login-error" class="form-error"></p>
        <button class="button" type="submit">Continue</button>
      </form>
    </section>
    <section id="workspace" class="workspace hidden">
      <aside class="sidebar">
        <nav id="kinds" class="kind-nav" aria-label="Event types"></nav>
        <div class="sidebar-note"><strong>In-memory</strong><span>Events disappear when this process stops.</span></div>
      </aside>
      <section class="main-workspace">
        <section id="dashboard-screen" class="dashboard-screen"></section>
        <section id="index-screen" class="index-screen">
          <section class="list-panel telescope-list-card">
            <div class="card-toolbar toolbar">
              <h2 id="screen-title">Requests</h2>
              <div class="search-wrap"><span aria-hidden="true"></span><input id="search" type="search" aria-label="Search profiler events" placeholder="Search entries…"></div>
              <label id="method-filter"><span>Method</span><select id="method"><option value="">All</option><option value="GET">GET</option><option value="POST">POST</option><option value="PUT">PUT</option><option value="PATCH">PATCH</option><option value="DELETE">DELETE</option><option value="HEAD">HEAD</option><option value="OPTIONS">OPTIONS</option><option value="CONNECT">CONNECT</option><option value="TRACE">TRACE</option></select></label>
              <label id="level-filter" class="hidden"><span>Level</span><select id="level"><option value="">All</option><option value="trace">TRACE</option><option value="debug">DEBUG</option><option value="info">INFO</option><option value="warn">WARN</option><option value="error">ERROR</option><option value="dpanic">DPANIC</option><option value="panic">PANIC</option><option value="fatal">FATAL</option></select></label>
              <label id="duration-filter"><span>Duration</span><select id="duration"><option value="0">All</option><option value="1">≥ 1 ms</option><option value="10">≥ 10 ms</option><option value="100">≥ 100 ms</option><option value="500">≥ 500 ms</option></select></label>
            </div>
            <div class="list-heading"><span>Verb</span><span>Path</span><span>Status</span><span>Duration</span><span>Happened</span><span></span></div>
            <div id="events" class="events"></div>
            <div id="empty" class="empty">Waiting for matching events…</div>
          </section>
        </section>
        <section id="detail-screen" class="detail-screen hidden">
          <div class="preview-navigation"><button id="back" class="back-button" type="button"><span aria-hidden="true">←</span> Back to requests</button></div>
          <div id="detail" class="detail"><div class="detail-empty"><span class="empty-mark">⌁</span><strong>No event selected</strong></div></div>
        </section>
      </section>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
